spring.application.name=${DB_NAME:backend-sistema-lpe}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/BackendLPE}
spring.datasource.username=${DB_USER_NAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
server.port=${PORT:8083}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.enabled=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:5173}

