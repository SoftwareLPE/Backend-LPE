version: "3.9"

services:
  db:
    image: postgres:16
    container_name: lpe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: backend_sistema_lpe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ADMINISTRADOR
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lpe-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_NAME: backend_sistema_lpe
      DB_URL: jdbc:postgresql://db:5432/backend_sistema_lpe
      DB_USER_NAME: postgres
      DB_PASSWORD: ADMINISTRADOR
    ports:
      - "8080:8080"
    command: ["java","-jar","app_backendLPE.jar"]

volumes:
  postgres_data:
